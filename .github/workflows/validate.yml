name: Validate public skill
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run_demo.py
      - name: Preserve dated public research assets
        run: git diff --exit-code -- tracking/forward_picks.csv reference/ticker_truth.csv tracking/scorecard.md
  cockpit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      SERENITY_SCHEDULER: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cockpit/requirements-lock.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cockpit/web/package-lock.json
      - run: python -m pip install -r cockpit/requirements-lock.txt
      - run: npm --prefix cockpit/web ci
      - run: npm --prefix cockpit/web audit --audit-level=moderate
      - run: npm --prefix cockpit/web run test
      - run: npm --prefix cockpit/web run build
      - run: python -m unittest discover -s cockpit/tests -v
      - run: python cockpit/run.py --check
      - run: python scripts/build_release.py --smoke --cockpit-smoke
